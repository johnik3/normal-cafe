#setBtn{position:fixed;z-index:12;left:auto;right:calc(10px + env(safe-area-inset-right));top:calc(8px + env(safe-area-inset-top));width:38px;height:38px;border-radius:50%;border:0;background:rgba(245,234,214,.94);box-shadow:0 2px 8px rgba(60,35,18,.32);padding:0;display:flex;align-items:center;justify-content:center;opacity:1}
#setBtn.hide{display:none}#setBtn svg{display:block}

.pn .g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}.pn .g3 button{font-size:12px;padding:9px 4px;line-height:1.25}.pn .sec{font:800 12px -apple-system,sans-serif;color:#8a6a50;margin:10px 0 6px}.pn button.w{grid-column:1/3}.pn button.c{background:transparent;grid-column:1/3;color:#8a6a50}

<script>
'use strict';
const cv=document.getElementById('c');let ctx=cv.getContext('2d');
let W=0,H=0,DPR=1;const L={};
const FONT='-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Noto Sans SC","Microsoft YaHei",sans-serif';
const SERIF='"Noto Serif SC","Songti SC","Source Han Serif SC","STSong","SimSun",serif';
try{document.fonts&&document.fonts.load('900 16px "Noto Serif SC"','正常营业咖啡店第天周');}catch(e){}
/* ---------- utils ---------- */
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),lerp=(a,b,t)=>a+(b-a)*t,rand=(a,b)=>a+Math.random()*(b-a),pick=a=>a[Math.floor(Math.random()*a.length)];
function hex(h){h=h.replace('#','');return[parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)];}
function mix(a,b,t){const A=hex(a),B=hex(b);t=clamp(t,0,1);return`rgb(${Math.round(lerp(A[0],B[0],t))},${Math.round(lerp(A[1],B[1],t))},${Math.round(lerp(A[2],B[2],t))})`;}
function gradAt(st,v){if(v<=st[0][0])return mix(st[0][1],st[0][1],0);for(let i=1;i<st.length;i++){if(v<=st[i][0]){const t=(v-st[i-1][0])/((st[i][0]-st[i-1][0])||1);return mix(st[i-1][1],st[i][1],t);}}const l=st[st.length-1][1];return mix(l,l,0);}
function rr(x,y,w,h,r){r=Math.min(r,w/2,h/2);ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function ell(x,y,rx,ry){ctx.beginPath();ctx.ellipse(x,y,Math.max(0.1,rx),Math.max(0.1,ry),0,0,Math.PI*2);}
function text(s,x,y,size,color,align='center',weight='600',alpha=1){ctx.globalAlpha=alpha;ctx.fillStyle=color;ctx.font=`${weight} ${size}px ${size>=13?SERIF:FONT}`;ctx.textAlign=align;ctx.textBaseline='middle';ctx.fillText(s,x,y);ctx.globalAlpha=1;}
const hit=(x,y,cx,cy,r)=>Math.hypot(x-cx,y-cy)<r;
function buzz(p){try{navigator.vibrate&&navigator.vibrate(p)}catch(e){}}
const store={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
function clockStr(m){const h=Math.floor(m/60),mm=Math.floor(m%60);return`${String(h).padStart(2,'0')}:${String(mm).padStart(2,'0')}`;}

/* ---------- audio ---------- */
let AC=null,master=null,noiseBuf=null;
function initAudio(){if(AC){if(master)master.gain.value=SET.sfx?0.85:0;if(AC.state==='suspended')AC.resume();return;}try{AC=new(window.AudioContext||window.webkitAudioContext)();master=AC.createGain();master.gain.value=(typeof SET!=='undefined'&&!SET.sfx)?0:0.85;master.connect(AC.destination);try{const conv=AC.createConvolver();const n=Math.floor(AC.sampleRate*1.1);const ir=AC.createBuffer(2,n,AC.sampleRate);for(let ch=0;ch<2;ch++){const dd=ir.getChannelData(ch);for(let i=0;i<n;i++)dd[i]=(Math.random()*2-1)*Math.pow(1-i/n,3.2);}conv.buffer=ir;const wet=AC.createGain();wet.gain.value=0.14;master.connect(conv);conv.connect(wet);wet.connect(AC.destination);}catch(e){}const len=AC.sampleRate*2;noiseBuf=AC.createBuffer(1,len,AC.sampleRate);const d=noiseBuf.getChannelData(0);for(let i=0;i<len;i++)d[i]=Math.random()*2-1;const s=AC.createBufferSource();s.buffer=AC.createBuffer(1,1,22050);s.connect(AC.destination);s.start(0);}catch(e){AC=null;}}
function tone(f,dur,type='sine',vol=0.3,when=0,slide=0){if(!AC)return;const t=AC.currentTime+when;const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(20,f*slide),t+dur);g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+0.008);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);o.connect(g);g.connect(master);o.start(t);o.stop(t+dur+0.05);}
function noiseBurst(dur,type,f,vol,q=1,when=0){if(!AC)return;const t=AC.currentTime+when;const s=AC.createBufferSource();s.buffer=noiseBuf;const fl=AC.createBiquadFilter();fl.type=type;fl.frequency.value=f;fl.Q.value=q;const g=AC.createGain();g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);s.connect(fl);fl.connect(g);g.connect(master);s.start(t,Math.random()*1.5);s.stop(t+dur+0.02);}
function loopNoise(type,f,q=1){if(!AC)return null;const s=AC.createBufferSource();s.buffer=noiseBuf;s.loop=true;const fl=AC.createBiquadFilter();fl.type=type;fl.frequency.value=f;fl.Q.value=q;const g=AC.createGain();g.gain.value=0;s.connect(fl);fl.connect(g);g.connect(master);s.start(0,Math.random());return{set(fr,v,r=0.05){const t=AC.currentTime;fl.frequency.setTargetAtTime(fr,t,r);g.gain.setTargetAtTime(v,t,r);},stop(){const t=AC.currentTime;g.gain.setTargetAtTime(0,t,0.03);try{s.stop(t+0.3)}catch(e){}}};}

// 声音即乐器：出杯、星星、店员接手、钱币的音，都落在背景音乐当前的和弦上，连击越高音越高
function chordNow(){if(MUS.started&&AC){const sd=60/92/4,st=(MUS.step-Math.max(0,Math.round((MUS.next-AC.currentTime)/sd))+64)%64;return CHORDS[Math.floor(st/16)%4];}return CHORDS[0];}
function noteAt(i,oct=0){const ch=chordNow(),k=((i%4)+4)%4;return ch[k]+12*(Math.floor(i/4)+oct);}
function mallet(m,vol=0.1,when=0,dur=0.35){const f=440*Math.pow(2,(m-69)/12);tone(f,dur,'sine',vol,when);tone(f*2,dur*0.45,'triangle',vol*0.26,when);tone(f*3.01,dur*0.2,'sine',vol*0.07,when);}
const ri=n=>Math.floor(Math.random()*n);
const SND={
 click(){tone(1800,0.03,'square',0.04);tone(900,0.05,'sine',0.1);},
 grind(){noiseBurst(0.35,'bandpass',1700,0.16,1.4);tone(120,0.3,'sawtooth',0.03);},
 stop(){tone(700,0.05,'square',0.05);noiseBurst(0.05,'highpass',3000,0.08);},
 pick(){tone(880,0.05,'sine',0.08);},
 clink(){mallet(noteAt(ri(4),3),0.07,0,0.12);tone(3500,0.04,'sine',0.03,0.02);},
 pour(){noiseBurst(0.5,'bandpass',900,0.12,1.2);},
 trash(){noiseBurst(0.25,'lowpass',500,0.25);tone(160,0.2,'sine',0.15,0,0.6);},
 pay(){const c=Math.min(G.combo||0,8);mallet(noteAt(c+2,1),0.16,0,0.3);mallet(noteAt(c,1),0.14,0.13,0.55);},
 coins(n){for(let i=0;i<n;i++){const t=0.25+i*0.07,f=440*Math.pow(2,(noteAt(ri(6),3)-69)/12);tone(f,0.13,'triangle',0.06,t);tone(f*1.5,0.1,'sine',0.035,t+0.02);}},
 perfect(c){const b=Math.min(Math.max(c,1)-1,8);[0,1,2,4].forEach((s,i)=>mallet(noteAt(b+s,1),0.12,0.05+i*0.055,0.42));},
 good(){mallet(noteAt(2,1),0.1,0,0.2);},
 wrong(){tone(220,0.18,'square',0.06);tone(196,0.22,'square',0.06,0.12);},
 leave(){tone(330,0.4,'triangle',0.1,0,0.6);},
 bell(){mallet(noteAt(1,2),0.1,0,0.9);mallet(noteAt(3,2),0.07,0.13,0.8);},
 gong(){tone(196,1.2,'triangle',0.2,0,0.98);tone(392,0.8,'sine',0.08);tone(587,0.6,'sine',0.05,0.05);},
 roar(){tone(70,1.4,'sawtooth',0.22,0,0.6);tone(105,1.2,'sawtooth',0.12,0.05,0.7);noiseBurst(1.2,'lowpass',300,0.35);},
 drawer(){noiseBurst(0.18,'lowpass',700,0.22);tone(240,0.08,'triangle',0.08,0.12);},
 sprinkle(){for(let i=0;i<6;i++)noiseBurst(0.03,'highpass',rand(5000,8000),0.05,1,i*0.035);tone(2093,0.12,'sine',0.04,0.05);},
 puff(){noiseBurst(0.28,'bandpass',600,0.32,0.8);noiseBurst(0.18,'highpass',2500,0.1);tone(180,0.15,'sawtooth',0.04,0,0.5);},
 sneeze(){tone(900,0.08,'sine',0.12,0,1.4);tone(700,0.12,'sine',0.12,0.1,0.5);noiseBurst(0.6,'bandpass',500,0.5,0.6,0.15);},
 chirp(){tone(1600,0.07,'sine',0.12,0,1.5);tone(2200,0.08,'sine',0.08,0.06,1.2);},
 yawn(){tone(500,0.5,'sine',0.08,0,0.6);},
 join(){[0,4,7,12,16].forEach((s,i)=>tone(659*Math.pow(2,s/12),0.3,'triangle',0.12,i*0.08));setTimeout(()=>SND.chirp(),500);}
};

/* ---------- fx ---------- */
let parts=[],floats=[],shake=0,flash=0;
function burst(x,y,n,colors,spd=4,life=0.9,grav=260,size=3){for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,s=rand(0.3,1)*spd*60;parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-spd*20,life,max:life,c:colors[i%colors.length],g:grav,sz:rand(0.6,1.3)*size,alpha:1,grow:0});}}
function addPart(o){parts.push(Object.assign({life:1,max:1,g:0,sz:3,c:'#fff',vx:0,vy:0,alpha:1,grow:0},o));}
function floatText(s,x,y,c,size=20,life=1.1){floats.push({s,x,y,c,size,life,max:life});}
function updFx(dt){for(const p of parts){p.life-=dt;p.vy+=p.g*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.sz+=p.grow*dt;}parts=parts.filter(p=>p.life>0);for(const f of floats){f.life-=dt;f.y-=30*dt;}floats=floats.filter(f=>f.life>0);shake=Math.max(0,shake-dt*40);flash=Math.max(0,flash-dt*2.5);}
function drawFx(){for(const p of parts){ctx.globalAlpha=clamp(p.life/p.max,0,1)*p.alpha;ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,Math.max(0.1,p.sz),0,7);ctx.fill();}ctx.globalAlpha=1;for(const f of floats){const age=f.max-f.life,a=clamp(f.life/f.max*1.6,0,1),sc=age<0.12?1+(0.12-age)*3:1;ctx.lineWidth=4;ctx.strokeStyle='rgba(20,12,8,0.6)';ctx.font=`800 ${f.size*sc}px ${FONT}`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.globalAlpha=a;ctx.strokeText(f.s,f.x,f.y);ctx.fillStyle=f.c;ctx.fillText(f.s,f.x,f.y);ctx.globalAlpha=1;}}

/* ---------- dragon art ---------- */
function drawQDragon(x,y,k,opt={}){const t=G.t;const sleep=opt.sleep,mouth=opt.mouth||0,mood=opt.mood||'idle';let jy=0;if(mood==='cheer')jy=-Math.abs(Math.sin(t*12))*k*0.35;const by=y+jy+Math.sin(t*2.2)*k*0.04;
 ctx.save();ctx.translate(x,by);
 const outline=()=>{ctx.lineWidth=k*0.16;ctx.strokeStyle='#f6ead4';ctx.lineJoin='round';};
 // shadow
 ctx.fillStyle='rgba(0,0,0,0.25)';ell(0,k*0.62-jy,k*0.75,k*0.14);ctx.fill();
 // tail
 ctx.beginPath();ctx.moveTo(k*0.45,k*0.35);ctx.quadraticCurveTo(k*1.05,k*0.4,k*0.95,k*0.0);outline();ctx.stroke();ctx.lineWidth=k*0.13;ctx.strokeStyle='#5fb37f';ctx.stroke();ctx.fillStyle='#f2c14e';ctx.beginPath();ctx.moveTo(k*0.95,-k*0.12);ctx.lineTo(k*1.08,k*0.05);ctx.lineTo(k*0.85,k*0.02);ctx.fill();
 // wings
 const fl=Math.sin(t*(mood==='cheer'?18:4))*0.25;for(const s of [-1,1]){ctx.save();ctx.translate(s*k*0.5,-k*0.15);ctx.rotate(s*(0.5+fl));ctx.beginPath();ctx.moveTo(0,0);ctx.quadraticCurveTo(s*k*0.45,-k*0.55,s*k*0.55,-k*0.05);ctx.quadraticCurveTo(s*k*0.3,-k*0.1,0,k*0.12);ctx.closePath();outline();ctx.stroke();ctx.fillStyle='#8fd3a8';ctx.fill();ctx.restore();}
 // body
 ctx.beginPath();ctx.ellipse(0,k*0.15,k*0.58,k*0.5,0,0,7);outline();ctx.stroke();ctx.fillStyle='#6cc08b';ctx.fill();ctx.fillStyle='#fdf0c8';ell(0,k*0.28,k*0.34,k*0.3);ctx.fill();
 // head
 ctx.beginPath();ctx.ellipse(0,-k*0.38,k*0.5,k*0.42,0,0,7);outline();ctx.stroke();ctx.fillStyle='#6cc08b';ctx.fill();
 // horns

  case'd32':devState(35);SAVE.vis.octo=3;SAVE.story='octo';save();go('open');break;
  case'd38':devState(41);SAVE.vis.plant=3;SAVE.story='plant';save();go('open');break;
  case'd28':devState(28);go('open');break;
  case'd29':devState(29);go('open');G.oneoffPlan={k:pick(['ghost','cat','traveler']),at:400};break;
  case'd39':devState(42);go('open');break;
  case'd42':devState(42);go('open');break;
  case'd43':devState(43);go('open');break;
  case'd50':devState(50,{money:21500});go('open');break;
  case'final':devState(51,{money:21500});SAVE.bossDone=1;G.endedDay=FINAL_DAY;G.wasSunday=false;save();go('review');break;
  case'ending':devState(51,{money:21500});SAVE.bossDone=1;SAVE.ending='true';save();go('ending');break;
  case'weekend':devState(22,{money:3200});SAVE.wk={w:3,served:120,perfects:60,hearts:14,lost:5,money:5400,best:980,bestDay:'周五',cups:['碎花杯'],staff:['雪人']};G.endedDay=21;G.wasSunday=true;save();go('weekend');break;
  case'shop':{const d=Math.max(1,SAVE.day-1);G.endedDay=d;go('shop');break;}}}
function devUI(){const btn_=document.getElementById('devBtn'),pn=document.getElementById('devPanel');
 const info=()=>{const st=STAFF_KEYS.filter(k=>SAVE.staff[k]).map(k=>STAFF[k].name).join('、')||'无';document.getElementById('devInfo').textContent=`第 ${SAVE.day} 天（第 ${week()} 周 ${cfg().wd}）· ${G.scene} · 存款 ¥${SAVE.weekMoney} · 店员：${st} · 摆件 ${(SAVE.lures||[]).map(k=>STAFF[k].name).join('→')||'无'} · 来访 ${STAFF_KEYS.map(k=>STAFF[k].name+SAVE.vis[k]).join(' ')}`;document.getElementById('devStats').textContent=timingText();};
 btn_.onclick=()=>{initAudio();info();pn.classList.toggle('show');};
 const story=k=>{musStop();const idx=STAFF_KEYS.indexOf(k);STAFF_KEYS.slice(0,idx).forEach(j=>{SAVE.staff[j]=true;SAVE.vis[j]=STAFF[j].n;});SAVE.staff[k]=false;SAVE.vis[k]=STAFF[k].n;SAVE.story=k;SAVE.lures=STAFF_KEYS.slice(1,idx+1);SAVE.day=Math.max(SAVE.day,[14,20,26,32,38][idx]);['ice','milk'].forEach(p=>SAVE.perks[p]=1);if(k==='dragon')SAVE.dragon=1;save();go('open');};
 const act={skip(){devSkip();},week(){musStop();SAVE.day=week()*7+1;SAVE.wk=null;save();go('open');},
  unlock(){['ice','milk','scoop','big','drawer','kettle','wide'].forEach(k=>SAVE.perks[k]=1);SAVE.drawer=true;save();},
  story(){const k=STAFF_KEYS.find(k=>!SAVE.staff[k])||'dragon';story(k);},
  finale(){musStop();STAFF_KEYS.forEach(k=>{SAVE.staff[k]=true;SAVE.vis[k]=STAFF[k].n;});SAVE.lures=STAFF_KEYS.slice(1);SAVE.dragon=2;['ice','milk','drawer'].forEach(p=>SAVE.perks[p]=1);SAVE.drawer=true;SAVE.story=null;SAVE.endingSeen=0;SAVE.bossDone=0;SAVE.day=FINAL_DAY;save();go('open');},
  ending(){musStop();STAFF_KEYS.forEach(k=>SAVE.staff[k]=true);SAVE.day=FINAL_DAY+1;G.endedDay=FINAL_DAY;G.wasSunday=false;save();go('review');},
  money(){SAVE.weekMoney+=500;save();},m5k(){SAVE.weekMoney+=5000;save();},
  front(){['plants','lamps','frame','awning','neon'].forEach(k=>SAVE.perks[k]=1);save();},
  allstaff(){STAFF_KEYS.forEach(k=>{SAVE.staff[k]=true;SAVE.vis[k]=STAFF[k].n;SAVE.duty[k]=true;});SAVE.dragon=2;SAVE.lures=STAFF_KEYS.slice(1);SAVE.story=null;if(!SAVE.drawer){SAVE.drawer=true;SAVE.perks.drawer=1;}save();},
  noStaff(){STAFF_KEYS.forEach(k=>{SAVE.staff[k]=false;SAVE.vis[k]=0;});SAVE.duty={};SAVE.dragon=0;SAVE.lures=[];SAVE.story=null;save();},copy(){const t=timingText();try{navigator.clipboard.writeText(t);}catch(e){}document.getElementById('devStats').textContent=t+'\n（已复制）';},
  clear(){STATS.drinks={};STATS.days=[];saveStats();},restart(){musStop();SAVE=freshSave();save();go('open');},close(){pn.classList.remove('show');}};
 pn.querySelectorAll('[data-j]').forEach(b=>b.onclick=()=>{initAudio();devJump(b.dataset.j);SND.click();pn.classList.remove('show');});
 pn.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{act[b.dataset.a]();SND.click();info();if(['skip','restart','week','story','finale','ending'].includes(b.dataset.a))pn.classList.remove('show');});}

/* ---------- 输入和主循环 ---------- */
const PTR={};
cv.addEventListener('pointerdown',e=>{e.preventDefault();initAudio();const id=e.pointerId;PTR[id]={x:e.clientX,y:e.clientY};try{cv.setPointerCapture(id)}catch(_){}const s=Scenes[G.scene];if(G.scene==='play')s.down(e.clientX,e.clientY,id);else if(Object.keys(PTR).length===1)s.down&&s.down(e.clientX,e.clientY,id);},{passive:false});
cv.addEventListener('pointermove',e=>{const id=e.pointerId;if(!PTR[id])return;e.preventDefault();PTR[id].x=e.clientX;PTR[id].y=e.clientY;const s=Scenes[G.scene];s.move&&s.move(e.clientX,e.clientY,id);},{passive:false});
function pUp(e){const id=e.pointerId;if(!PTR[id])return;delete PTR[id];const s=Scenes[G.scene];s.up&&s.up(id);}
cv.addEventListener('pointerup',pUp);cv.addEventListener('pointercancel',pUp);cv.addEventListener('lostpointercapture',pUp);
['touchstart','touchmove','touchend'].forEach(t=>document.addEventListener(t,e=>{if(e.target===cv)e.preventDefault();},{passive:false}));document.addEventListener('gesturestart',e=>e.preventDefault());
document.addEventListener('visibilitychange',()=>{if(document.hidden){const s=Scenes[G.scene];for(const k of Object.keys(PTR)){delete PTR[k];s.up&&s.up(+k);}save();saveStats();if(MUS.started&&AC)AC.suspend&&AC.suspend();}else if(AC&&AC.state==='suspended'&&!G.paused)AC.resume();});
window.addEventListener('pagehide',()=>{save();saveStats();});
let last=performance.now();
function frame(now){const raw=(now-last)/1000;let dt=Math.min(0.05,raw);last=now;
 if(G.scene==='play'&&QUAL.mode==='auto'&&raw>0&&raw<0.5&&!document.hidden){QUAL.acc+=raw;QUAL.n++;if(QUAL.acc>=3){const fps=QUAL.n/QUAL.acc;if(fps<40&&QUAL.lv>0){QUAL.lv--;store.set('cafe_qlv',QUAL.lv);}QUAL.acc=0;QUAL.n=0;}}if(G.hitStop>0){G.hitStop-=dt;dt*=0.04;}G.t+=dt;G.sceneT+=dt;const sc=Scenes[G.scene];
 if(G.paused)dt=0;
 try{if(!G.paused){sc.update&&sc.update(dt);updFx(dt);}ctx.setTransform(DPR,0,0,DPR,0,0);ctx.save();if(shake>0)ctx.translate(rand(-1,1)*shake*0.6,rand(-1,1)*shake*0.6);sc.draw();ctx.restore();drawGrain();if(flash>0){ctx.fillStyle=`rgba(255,215,140,${flash*0.14})`;ctx.fillRect(0,0,W,H);}}
 catch(err){ctx.restore&&ctx.restore();if(!frame.err){frame.err=1;console.error(err);}}
 requestAnimationFrame(frame);}
MUS.on=SET.music;
if(/dev/.test(location.search+location.hash)||store.get('cafe_dev',0))document.body.classList.add('dev');
newDay();setUI();devUI();go(store.get('cafe20_cover',0)?(SAVE.introSeen?'open':'intro'):'cover');
const ld=document.getElementById('loading');if(ld)ld.remove();
requestAnimationFrame(frame);
window.__G=G;window.__SC=Scenes;window.__S=()=>SAVE;window.__L=L;window.__go=go;window.__STATS=STATS;

</script>
